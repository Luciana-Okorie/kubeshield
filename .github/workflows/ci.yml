name: KubeShield CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/kubeshield-api ./cmd/api
      - run: go build -o /tmp/kubeshield-agent ./cmd/kubeshield-api
